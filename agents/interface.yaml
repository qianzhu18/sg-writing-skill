interface:
  display_name: "SG 克制叙事写作"
  short_description: "SG克制叙事：情话、长篇故事与同案五视角改写"
  default_prompt: "用 SG 写作写一段动人的原创情话，只输出成稿"

compatibility:
  adapter_targets:
    - claude
    - openai
    - generic
    - agent-skills-compatible

name: sg-writing-skill
version: 1.4.0

inputs:
  - name: topic
    description: 写作主题、场景、人物关系或情感冲突
    required: true
  - name: source_text
    description: 需要改写、收紧或诊断的原始文本（可选）
    required: false
  - name: mode
    description: generate、rewrite、tighten、diagnose 或 multi_perspective（可选，默认自动判断）
    required: false
  - name: length
    description: 目标字数或长度范围（可选，默认尊重用户上下文）
    required: false
  - name: constraints
    description: 必须保留的事实、视角、格式、禁用项或发布场景（可选）
    required: false
  - name: perspectives
    description: 多视角任务中的角色列表、知识边界和共同事件约束（可选）
    required: false

outputs:
  - name: prose
    description: 原创中文散文或改写后的成稿
  - name: style_notes
    description: 仅在用户要求分析或说明时返回的简短技法说明

triggers:
  - "SG写作"
  - "sg-writing-skill"
  - "SYC风格"
  - "孙宇晨文风"
  - "克制散文"
  - "冰山叙事"
  - "数字锚点散文"
  - "动人情话"
  - "写好叙事故事"
  - "多视角叙事"
  - "同一个故事换几个视角"
  - "角色视角改写"
  - "我的女友景甜"
  - "孙宇晨景甜张继科多视角"
  - "跟原文差不多长"
  - "去掉AI味和直白情绪"

excludes:
  - 新闻报道的事实核查与发布
  - 技术文档和学术论文
  - 以转化为首要目标的营销文案
  - 冒充真实人物或复现受版权保护的原文
